async function api(a,o){o=o||{};try{const r=await fetch(API+"?a="+a,{method:o.method||"GET",headers:Object.assign({"Content-Type":"application/json"},AUTH?{Authorization:"Bearer "+AUTH.token}:{}),body:o.body?JSON.stringify(o.body):undefined});const j=await r.json();if(r.status==401&&AUTH&&a=="data"){AUTH=null;try{localStorage.removeItem("ptauth")}catch(e){}render()}return j}catch(e){return{}}}
function push(now){if(!AUTH)return;clearTimeout(T);T=setTimeout(()=>api("data",{method:"PUT",body:{PL,prog}}),now?0:800)}
function loginView(){$("#nav").innerHTML="";$("#acct").innerHTML="";$("#main").innerHTML=cw('<h2 style="margin:0 0 4px">'+(L.mode=="login"?"Log in":"Create your account")+'</h2><p class="sub">Your plan and points are saved to your account, so they follow you to any device.</p><label style="flex-direction:column;align-items:stretch;margin-bottom:10px">Email<input class="ans" id="em" type="email" autocomplete="email"></label><label style="flex-direction:column;align-items:stretch">Password (8+ characters)<input class="ans" id="pw" type="password" autocomplete="'+(L.mode=="login"?"current-password":"new-password")+'"></label><div class="msg" id="lerr">'+L.err+'</div><div class="row"><button class="btn" data-au="go">'+(L.mode=="login"?"Log in":"Sign up")+'</button><button class="btn alt" data-au="mode">'+(L.mode=="login"?"I need an account":"I already have an account")+'</button></div>')}
document.addEventListener("click",async ev=>{const t=ev.target.closest("button");if(!t||!t.dataset.au)return;
if(t.dataset.au=="mode"){L.mode=L.mode=="login"?"signup":"login";L.err="";return loginView()}
const email=$("#em").value,password=$("#pw").value;$("#lerr").textContent="Working...";t.disabled=true;
const r=await api(L.mode,{method:"POST",body:{email,password}});
if(r.token){AUTH={token:r.token,email:r.email};try{localStorage.setItem("ptauth",JSON.stringify(AUTH))}catch(e){}
const c=await api("data");if(c.data){PL=c.data.PL||null;prog=c.data.prog||{};try{localStorage.setItem("ptplan",JSON.stringify(PL));localStorage.setItem("ptprog",JSON.stringify(prog))}catch(e){}}else push(true);
L.err="";return render()}
L.err=r.error||"Could not reach the server. Try again.";loginView()});
document.addEventListener("keydown",ev=>{if(ev.key=="Enter"&&ev.target.id=="pw"){const b=document.querySelector('[data-au="go"]');if(b)b.click()}});
if(AUTH)api("data").then(c=>{if(c.data&&!R){PL=c.data.PL||PL;prog=c.data.prog||prog;render()}});
render();
</script>
</body>
</html>
